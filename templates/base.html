{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Movie Review Platform{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <header>
      <nav>
        <a href="/" class="brand">Movie Review Platform</a>

        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/movies/">Movies</a>
          <a href="/dashboard/">Dashboard</a>
        </div>
      </nav>
    </header>

    <main>{% block content %} {% endblock %}</main>

    <footer>
      <p>&copy; 2026 Movie Review Platform</p>
    </footer>

    {% block extra_js %}{% endblock %}
  </body>
</html>
