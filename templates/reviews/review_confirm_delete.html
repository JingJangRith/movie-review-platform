{% extends "base.html" %} {% block title %}Delete Review{% endblock %} {% block
content %}
<h1>Delete Review</h1>

<p>
  Are you sure you want to delete your review for "{{ review.movie.title }}"?
</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Delete Review</button>
</form>

<a href="{% url 'movie_detail' review.movie.pk %}">Cancel</a>
{% endblock %}
